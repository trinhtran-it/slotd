openapi: 3.0.3
info:
  title: slotd API
  version: 0.1.0
  description: |
    Booking engine. Providers publish weekly availability in their own time zone;
    clients list free slots and hold them. A hold blocks the slot for a limited
    time until it is confirmed, cancelled, or expires.

    All timestamps are RFC 3339. Responses use UTC. Errors are RFC 9457
    `application/problem+json`; branch on the `code` member.
servers:
  - url: http://localhost:8080

tags:
  - name: providers
  - name: bookings

paths:
  /v1/providers:
    post:
      tags: [providers]
      operationId: createProvider
      summary: Create a provider
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateProviderRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Provider" }
        "400": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/providers/{id}/availability:
    put:
      tags: [providers]
      operationId: setAvailability
      summary: Replace a provider's weekly availability
      description: Replaces all rules. Rules on the same weekday must not overlap.
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Availability" }
      responses:
        "200":
          description: The stored rules
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Availability" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/providers/{id}/slots:
    get:
      tags: [providers]
      operationId: listSlots
      summary: List free slots
      description: |
        Free slots of `duration` minutes within [from, to). Slots start at each
        availability window's start and repeat back to back. Past slots are
        never returned. The range may span at most 31 days.
      parameters:
        - $ref: "#/components/parameters/ID"
        - name: from
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date-time }
        - name: duration
          in: query
          required: true
          description: Slot length in minutes.
          schema: { type: integer, minimum: 5, maximum: 720 }
      responses:
        "200":
          description: Free slots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SlotList" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/bookings:
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Hold a time range
      description: |
        Creates a booking in status `held`. The range must be in the future and
        inside the provider's availability. Returns 409 if another active booking
        overlaps it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateBookingRequest" }
      responses:
        "201":
          description: Held
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /v1/bookings/{id}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: Read a booking
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: The booking
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Problem" }

  /v1/bookings/{id}/confirm:
    post:
      tags: [bookings]
      operationId: confirmBooking
      summary: Confirm a held booking
      description: Not implemented yet (returns 501).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Confirmed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }

  /v1/bookings/{id}/cancel:
    post:
      tags: [bookings]
      operationId: cancelBooking
      summary: Cancel a booking
      description: Not implemented yet (returns 501).
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Cancelled
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Booking" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "501": { $ref: "#/components/responses/Problem" }

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    CreateProviderRequest:
      type: object
      required: [name, timezone]
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 200, example: Dr. Example }
        timezone: { type: string, description: IANA time zone, example: Europe/Berlin }

    Provider:
      type: object
      required: [id, name, timezone, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        timezone: { type: string }
        created_at: { type: string, format: date-time }

    Weekday:
      type: string
      enum: [monday, tuesday, wednesday, thursday, friday, saturday, sunday]

    AvailabilityRule:
      type: object
      required: [weekday, start, end]
      additionalProperties: false
      description: Local wall-clock window in the provider's time zone; end is exclusive.
      properties:
        weekday: { $ref: "#/components/schemas/Weekday" }
        start: { type: string, pattern: "^([01][0-9]|2[0-3]):[0-5][0-9]$", example: "09:00" }
        end: { type: string, pattern: "^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$", example: "17:00" }

    Availability:
      type: object
      required: [rules]
      additionalProperties: false
      properties:
        rules:
          type: array
          maxItems: 100
          items: { $ref: "#/components/schemas/AvailabilityRule" }

    Slot:
      type: object
      required: [start, end]
      properties:
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }

    SlotList:
      type: object
      required: [provider_id, timezone, duration, slots]
      properties:
        provider_id: { type: string, format: uuid }
        timezone: { type: string }
        duration: { type: integer, description: Slot length in minutes }
        slots:
          type: array
          items: { $ref: "#/components/schemas/Slot" }

    CreateBookingRequest:
      type: object
      required: [provider_id, customer_id, start, duration]
      additionalProperties: false
      properties:
        provider_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        start: { type: string, format: date-time }
        duration: { type: integer, minimum: 5, maximum: 720, description: Minutes }

    BookingStatus:
      type: string
      enum: [held, confirmed, cancelled, expired]

    Booking:
      type: object
      required: [id, provider_id, customer_id, start, end, status, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        provider_id: { type: string, format: uuid }
        customer_id: { type: string, format: uuid }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/BookingStatus" }
        hold_expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string, example: about:blank }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code:
          type: string
          description: Stable machine-readable error code.
          enum:
            - bad_request
            - invalid_input
            - not_found
            - slot_taken
            - outside_availability
            - hold_expired
            - invalid_transition
            - not_implemented
            - unavailable
            - internal
        request_id: { type: string }
