# Local development dependencies. The api and worker binaries run on the host
# (go run ./cmd/...) and connect to these services on localhost.
# All credentials below are local-only defaults, never used outside this stack.
name: slotd

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: slotd
      POSTGRES_PASSWORD: slotd
      POSTGRES_DB: slotd
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slotd -d slotd"]
      interval: 2s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.15-alpine
    command: ["--jetstream", "--store_dir", "/data", "--http_port", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8222/healthz?js-enabled-only=true"]
      interval: 2s
      timeout: 3s
      retries: 30

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686" # UI
      - "${OTLP_GRPC_PORT:-4317}:4317"   # OTLP gRPC
      - "${OTLP_HTTP_PORT:-4318}:4318"   # OTLP HTTP

  prometheus:
    image: prom/prometheus:v3.16.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway" # scrape binaries running on the host
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  grafana:
    image: grafana/grafana:13.3.2
    environment:
      # Local dev only: anonymous admin, no login screen.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  pgdata:
  natsdata:
